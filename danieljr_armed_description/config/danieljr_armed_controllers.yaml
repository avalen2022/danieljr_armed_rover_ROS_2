      - effort
    allow_nonzero_velocity_at_trajectory_end: true
/**/gates_controller:
  ros__parameters:
    joints:
      - gate_1_link_joint
      - gate_2_link_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
